services:
  backend:
    build: ./backend
    container_name: two-sided-dice-backend
    environment:
      DICE_MODE: ${DICE_MODE:-two-sided}
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    container_name: two-sided-dice-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
